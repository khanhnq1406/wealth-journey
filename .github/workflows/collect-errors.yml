name: Collect CI Errors

# NOTE: workflow_run triggers are only active on the default branch (main).
# This workflow will NOT appear in GitHub Actions while it is on a feature branch.
# It will register and start running automatically after this branch is merged to main.
on:
  workflow_run:
    workflows:
      - Backend CI
      - Frontend CI
      - Security
    types:
      - completed

jobs:
  collect:
    name: Collect All Error Logs
    runs-on: ubuntu-latest
    # Only run when at least one workflow failed
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Download all error artifacts from this workflow run
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Get the head SHA and PR number from the triggering workflow run
            const triggerRun = context.payload.workflow_run;
            const headSha = triggerRun.head_sha;
            const headBranch = triggerRun.head_branch;

            console.log(`Triggered by: ${triggerRun.name} (${triggerRun.conclusion})`);
            console.log(`Head SHA: ${headSha}`);

            // Find all workflow runs for the same commit across Backend CI, Frontend CI, Security
            const workflowNames = ['Backend CI', 'Frontend CI', 'Security'];
            const allArtifacts = [];

            for (const workflowName of workflowNames) {
              // List workflow runs for this workflow on the same commit
              const runs = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: headSha,
                status: 'completed',
                per_page: 10,
              });

              const matchingRuns = runs.data.workflow_runs.filter(
                r => r.name === workflowName
              );

              for (const run of matchingRuns) {
                if (run.conclusion !== 'failure') continue;

                console.log(`Fetching artifacts for: ${workflowName} (run ${run.id})`);

                const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });

                for (const artifact of artifacts.data.artifacts) {
                  // Only collect error artifacts (skip playwright-report etc.)
                  if (!artifact.name.endsWith('-errors')) continue;

                  console.log(`  Found artifact: ${artifact.name}`);
                  allArtifacts.push({
                    workflowName,
                    runId: run.id,
                    artifactId: artifact.id,
                    artifactName: artifact.name,
                  });
                }
              }
            }

            if (allArtifacts.length === 0) {
              console.log('No error artifacts found — all workflows passed or no errors captured.');
              fs.writeFileSync('/tmp/all-errors.txt',
                `# CI Error Report\n\nNo error artifacts found for commit ${headSha}.\nAll workflows may have passed, or errors were not captured.\n`
              );
              return;
            }

            // Download and merge all artifacts
            fs.mkdirSync('/tmp/artifacts', { recursive: true });
            const lines = [
              `# CI Error Report`,
              ``,
              `Commit: ${headSha}`,
              `Branch: ${headBranch}`,
              `Generated: ${new Date().toISOString()}`,
              ``,
              `---`,
              ``,
            ];

            for (const a of allArtifacts) {
              console.log(`Downloading artifact ${a.artifactName} from ${a.workflowName}...`);

              const download = await github.rest.actions.downloadArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: a.artifactId,
                archive_format: 'zip',
              });

              const zipPath = `/tmp/artifacts/${a.artifactName}.zip`;
              fs.writeFileSync(zipPath, Buffer.from(download.data));

              // Extract zip — errors.txt is inside the zip
              const { execSync } = require('child_process');
              const extractDir = `/tmp/artifacts/${a.artifactName}`;
              fs.mkdirSync(extractDir, { recursive: true });
              execSync(`unzip -o ${zipPath} -d ${extractDir}`);

              const errorsFile = `${extractDir}/errors.txt`;
              if (fs.existsSync(errorsFile)) {
                const content = fs.readFileSync(errorsFile, 'utf8');
                lines.push(content);
                lines.push('');
                lines.push('---');
                lines.push('');
              } else {
                lines.push(`## ${a.workflowName} — ${a.artifactName}`);
                lines.push(`(no errors.txt found in artifact)`);
                lines.push('');
                lines.push('---');
                lines.push('');
              }
            }

            fs.writeFileSync('/tmp/all-errors.txt', lines.join('\n'));
            console.log(`Written /tmp/all-errors.txt (${fs.statSync('/tmp/all-errors.txt').size} bytes)`);

      - name: Write combined errors to job summary
        if: always()
        run: |
          echo "## CI Error Report — All Workflows" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/all-errors.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload combined error artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-ci-errors
          path: /tmp/all-errors.txt
          retention-days: 7
