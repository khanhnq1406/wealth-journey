name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'src/go-backend/**'
      - 'api/protobuf/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/go-backend/**'
      - 'api/protobuf/**'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/go-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: src/go-backend/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: src/go-backend

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/go-backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: wealthjourney_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: testuser
      DB_PASSWORD: testpass
      DB_NAME: wealthjourney_test
      REDIS_URL: localhost:6379
      REDIS_PASSWORD: ""
      JWT_SECRET: ci-test-secret-not-real
      JWT_EXPIRATION: 168h
      YAHOO_FINANCE_ENABLED: "false"
      FX_ENABLED: "false"
      STORAGE_PROVIDER: local
      UPLOAD_DIR: /tmp/wealthjourney-uploads

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: src/go-backend/go.sum

      - name: Run tests
        run: go test -v -count=1 -timeout=10m ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/go-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: src/go-backend/go.sum

      - name: Verify compilation
        run: go build -o /dev/null ./cmd/server/main.go
