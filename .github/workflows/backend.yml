name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/go-backend/**'
      - 'api/protobuf/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/go-backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: src/go-backend/go.sum

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ hashFiles('src/go-backend/go.sum') }}-${{ hashFiles('src/go-backend/**/*.go') }}
          restore-keys: |
            go-build-${{ hashFiles('src/go-backend/go.sum') }}-
            go-build-

      - name: Run golangci-lint
        id: golangci
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: src/go-backend

      - name: Verify compilation
        id: go-build
        run: |
          mkdir -p /tmp/ci-errors
          go build -o /dev/null ./cmd/server/main.go 2>&1 | tee /tmp/ci-errors/build-output.txt
          exit ${PIPESTATUS[0]}

      - name: Capture errors
        if: failure()
        run: |
          mkdir -p /tmp/ci-errors
          {
            echo "## Backend Lint & Build Errors"
            echo "Job: ${{ github.job }} | Run: ${{ github.run_id }}"
            echo ""
            if [ "${{ steps.golangci.outcome }}" == "failure" ]; then
              echo "### Lint errors:"
              echo "golangci-lint failed. Check the 'Run golangci-lint' step logs above for details."
              echo ""
            fi
            if [ -s /tmp/ci-errors/build-output.txt ] && [ "${{ steps.go-build.outcome }}" == "failure" ]; then
              echo "### Build errors:"
              cat /tmp/ci-errors/build-output.txt
            fi
          } > /tmp/ci-errors/errors.txt

      - name: Write errors to job summary
        if: failure()
        run: |
          echo "## ❌ Backend Lint & Build Failed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/ci-errors/errors.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload error artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-lint-build-errors
          path: /tmp/ci-errors/errors.txt
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/go-backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: wealthjourney_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: testuser
      DB_PASSWORD: testpass
      DB_NAME: wealthjourney_test
      DB_SSL_MODE: disable
      REDIS_URL: localhost:6379
      REDIS_PASSWORD: ""
      JWT_SECRET: ci-test-secret-not-real
      JWT_EXPIRATION: 168h
      YAHOO_FINANCE_ENABLED: "false"
      FX_ENABLED: "false"
      STORAGE_PROVIDER: local
      UPLOAD_DIR: /tmp/wealthjourney-uploads

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: src/go-backend/go.sum

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ hashFiles('src/go-backend/go.sum') }}-${{ hashFiles('src/go-backend/**/*.go') }}
          restore-keys: |
            go-build-${{ hashFiles('src/go-backend/go.sum') }}-
            go-build-

      - name: Run tests
        id: go-test
        run: |
          mkdir -p /tmp/ci-errors
          go test -v -short -count=1 -timeout=10m ./... 2>&1 | tee /tmp/ci-errors/test-output.txt
          exit ${PIPESTATUS[0]}

      - name: Capture test errors
        if: failure()
        run: |
          echo "## Backend Test Errors" > /tmp/ci-errors/errors.txt
          echo "Job: ${{ github.job }} | Run: ${{ github.run_id }}" >> /tmp/ci-errors/errors.txt
          echo "" >> /tmp/ci-errors/errors.txt
          grep -E "^(--- FAIL|FAIL|panic:|Error)" /tmp/ci-errors/test-output.txt >> /tmp/ci-errors/errors.txt || true
          echo "" >> /tmp/ci-errors/errors.txt
          echo "### Full output:" >> /tmp/ci-errors/errors.txt
          cat /tmp/ci-errors/test-output.txt >> /tmp/ci-errors/errors.txt

      - name: Write test errors to job summary
        if: failure()
        run: |
          echo "## ❌ Backend Tests Failed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "^(--- FAIL|FAIL|panic:|Error)" /tmp/ci-errors/test-output.txt || echo "See artifact for full output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "[Download full error log from artifacts]()" >> $GITHUB_STEP_SUMMARY

      - name: Upload test error artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-errors
          path: /tmp/ci-errors/errors.txt
          retention-days: 7
