name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly: Monday at 9:00 UTC
    - cron: '0 9 * * 1'

jobs:
  go-vulnerabilities:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/go-backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: src/go-backend/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        id: govulncheck
        run: |
          mkdir -p /tmp/ci-errors
          govulncheck ./... 2>&1 | tee /tmp/ci-errors/govulncheck-output.txt
          exit ${PIPESTATUS[0]}

      - name: Capture govulncheck errors
        if: failure()
        run: |
          echo "## Go Vulnerability Check Errors" > /tmp/ci-errors/errors.txt
          echo "Job: ${{ github.job }} | Run: ${{ github.run_id }}" >> /tmp/ci-errors/errors.txt
          echo "" >> /tmp/ci-errors/errors.txt
          cat /tmp/ci-errors/govulncheck-output.txt >> /tmp/ci-errors/errors.txt

      - name: Write govulncheck errors to job summary
        if: failure()
        run: |
          echo "## ❌ Go Vulnerability Check Failed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/ci-errors/govulncheck-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload govulncheck error artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: go-vulnerability-errors
          path: /tmp/ci-errors/errors.txt
          retention-days: 7

  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/wj-client
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/wj-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Fix patchable vulnerabilities
        run: npm audit fix 2>&1 || true

      - name: Run npm audit
        id: npm-audit
        run: |
          mkdir -p /tmp/ci-errors
          npm audit --audit-level=critical 2>&1 | tee /tmp/ci-errors/npm-audit-output.txt
          exit ${PIPESTATUS[0]}

      - name: Capture npm audit errors
        if: failure()
        run: |
          echo "## npm Audit Errors" > /tmp/ci-errors/errors.txt
          echo "Job: ${{ github.job }} | Run: ${{ github.run_id }}" >> /tmp/ci-errors/errors.txt
          echo "" >> /tmp/ci-errors/errors.txt
          cat /tmp/ci-errors/npm-audit-output.txt >> /tmp/ci-errors/errors.txt

      - name: Write npm audit errors to job summary
        if: failure()
        run: |
          echo "## ❌ npm Audit Failed (critical severity vulnerabilities found)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/ci-errors/npm-audit-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload npm audit error artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-errors
          path: /tmp/ci-errors/errors.txt
          retention-days: 7
