             M176,32 C182,34 186,38 190,44 M192,48 C196,52 198,58 200,64
             M200,68 C202,74 202,80 200,86 M198,90 C196,96 192,102 188,106
             M184,110 C180,114 174,118 168,120 M162,120 C156,118 150,114 146,108
             M142,102 C140,96 140,90 142,84 M144,78 C146,72 150,66 156,62
             M160,58 C166,54 172,52 178,52 M184,54 C190,56 194,60 198,66"
