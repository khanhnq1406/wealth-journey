    <!-- Dragon pearl / fireball -->
    <circle cx="18" cy="52" r="8"/>
    <circle cx="18" cy="52" r="5" style="fill: white; opacity: 0.15;"/>
    <path d="M10,52 C10,44 18,40 18,44 C18,40 26,44 26,52 C26,60 18,64 18,60 C18,64 10,60 10,52 Z"
