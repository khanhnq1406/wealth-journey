    <path d="M28,65 C18,68 8,76 2,86 C6,80 14,74 22,70" fill="none" stroke="#C5923A" stroke-width="2" stroke-opacity="0.3"/>
    <path d="M35,35 C30,26 20,20 8,18 C16,22 24,28 30,36" fill="none" stroke="#C5923A" stroke-width="1.5" stroke-opacity="0.3"/>

