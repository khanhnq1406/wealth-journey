// SearchSymbolsRequest represents the search request parameters
message SearchSymbolsRequest {
  string query = 1 [json_name = "query"];  // Search query (e.g., "AAPL", "Apple", "Bitcoin")
  int32 limit = 2 [json_name = "limit"];   // Max results to return (default: 10, max: 20)
}

// SearchResult represents a single search result from Yahoo Finance
message SearchResult {
  string symbol = 1 [json_name = "symbol"];       // Ticker symbol (e.g., "AAPL", "BTC-USD")
  string name = 2 [json_name = "name"];           // Company/asset name
  string type = 3 [json_name = "type"];           // Type from quoteType (EQUITY, ETF, CRYPTOCURRENCY, etc.)
  string exchange = 4 [json_name = "exchange"];   // Exchange code (NAS, NMS, VSE, etc.)
  string exchDisp = 5 [json_name = "exchDisp"];   // Display name for exchange
  string currency = 6 [json_name = "currency"];   // Trading currency (ISO 4217), derived from exchange
}

// SearchSymbolsResponse represents the search response
message SearchSymbolsResponse {
  bool success = 1 [json_name = "success"];
  string message = 2 [json_name = "message"];
  repeated SearchResult data = 3 [json_name = "data"];
  string timestamp = 4 [json_name = "timestamp"];
}

// ListUserInvestmentsRequest for listing investments across all wallets or filtered
message ListUserInvestmentsRequest {
  wealthjourney.common.v1.PaginationParams pagination = 1 [json_name = "pagination"];
  InvestmentType typeFilter = 2 [json_name = "typeFilter"];  // Optional filter by investment type
  int32 walletId = 3 [json_name = "walletId"];  // Optional: 0 or omitted = all investment wallets
}

// ListUserInvestmentsResponse for user investments list
message ListUserInvestmentsResponse {
  bool success = 1 [json_name = "success"];
  string message = 2 [json_name = "message"];
  repeated Investment investments = 3 [json_name = "investments"];
  int32 totalCount = 4 [json_name = "totalCount"];
  string timestamp = 5 [json_name = "timestamp"];
  wealthjourney.common.v1.PaginationResult pagination = 6 [json_name = "pagination"];
}

// GetAggregatedPortfolioSummaryRequest for aggregated portfolio summary
message GetAggregatedPortfolioSummaryRequest {
  int32 walletId = 1 [json_name = "walletId"];  // Optional: 0 or omitted = aggregate all investment wallets
  InvestmentType typeFilter = 2 [json_name = "typeFilter"];  // Optional filter by investment type
  PnlPeriod period = 3 [json_name = "period"];  // Optional — default PERIOD_ALL
}

// MarketTypeItem represents a single gold or silver type (public, no prices)
message MarketTypeItem {
  string code = 1 [json_name = "code"];
  string name = 2 [json_name = "name"];
  string currency = 3 [json_name = "currency"];
}

// GetPublicMarketTypesRequest is empty (no auth, no params)
message GetPublicMarketTypesRequest {}

// GetPublicMarketTypesResponse returns gold/silver/currency type names without prices
message GetPublicMarketTypesResponse {
  bool success = 1 [json_name = "success"];
  string message = 2 [json_name = "message"];
  repeated MarketTypeItem gold = 3 [json_name = "gold"];
  repeated MarketTypeItem silver = 4 [json_name = "silver"];
  string timestamp = 5 [json_name = "timestamp"];
  repeated MarketTypeItem currency = 6 [json_name = "currency"];
}

// ── User Price Alert Enums ──

enum AlertDirection {
  ALERT_DIRECTION_UNSPECIFIED = 0;
  ALERT_DIRECTION_ABOVE = 1;
  ALERT_DIRECTION_BELOW = 2;
}

enum AlertTriggerMode {
  ALERT_TRIGGER_MODE_UNSPECIFIED = 0;
  ALERT_TRIGGER_MODE_ONCE = 1;
  ALERT_TRIGGER_MODE_REPEAT = 2;
}

enum AlertStatus {
  ALERT_STATUS_UNSPECIFIED = 0;
  ALERT_STATUS_ACTIVE = 1;
  ALERT_STATUS_TRIGGERED = 2;
  ALERT_STATUS_PAUSED = 3;
}

// ── User Price Alert Messages ──

message UserPriceAlert {
  int32 id = 1 [json_name = "id"];
  int32 user_id = 2 [json_name = "userId"];
  string symbol = 3 [json_name = "symbol"];
  string name = 4 [json_name = "name"];
  InvestmentType asset_type = 5 [json_name = "assetType"];
  string currency = 6 [json_name = "currency"];
  string price_side = 7 [json_name = "priceSide"];
  AlertDirection direction = 8 [json_name = "direction"];
  int64 target_price = 9 [json_name = "targetPrice"];
  AlertTriggerMode trigger_mode = 10 [json_name = "triggerMode"];
  int32 cooldown_hours = 11 [json_name = "cooldownHours"];
  AlertStatus status = 12 [json_name = "status"];
  string note = 13 [json_name = "note"];
  int64 last_triggered_at = 14 [json_name = "lastTriggeredAt"];
  int32 trigger_count = 15 [json_name = "triggerCount"];
  int64 current_price_at_creation = 16 [json_name = "currentPriceAtCreation"];
  int64 current_price = 17 [json_name = "currentPrice"];
  int64 created_at = 18 [json_name = "createdAt"];
}

message CreateUserPriceAlertRequest {
  string symbol = 1 [json_name = "symbol"];
  string name = 2 [json_name = "name"];
  InvestmentType asset_type = 3 [json_name = "assetType"];
  string currency = 4 [json_name = "currency"];
  string price_side = 5 [json_name = "priceSide"];
  AlertDirection direction = 6 [json_name = "direction"];
  int64 target_price = 7 [json_name = "targetPrice"];
  AlertTriggerMode trigger_mode = 8 [json_name = "triggerMode"];
  int32 cooldown_hours = 9 [json_name = "cooldownHours"];
  string note = 10 [json_name = "note"];
}

message CreateUserPriceAlertResponse {
  bool success = 1 [json_name = "success"];
  string message = 2 [json_name = "message"];
  UserPriceAlert alert = 3 [json_name = "alert"];
  string timestamp = 4 [json_name = "timestamp"];
}

message ListUserPriceAlertsRequest {
