syntax = "proto3";

package wealthjourney.investment.v1;

import "protobuf/v1/common.proto";
import "google/api/annotations.proto";

option go_package = "protobuf/v1";

// Investment represents an individual holding within an investment wallet
message Investment {
  int32 id = 1 [json_name = "id"];
  int32 walletId = 2 [json_name = "walletId"];  // Optional: 0 or omitted = no wallet association
  string symbol = 3 [json_name = "symbol"];  // e.g., "BTC", "AAPL", "VFINX"
  string name = 4 [json_name = "name"];  // e.g., "Bitcoin", "Apple Inc.", "Vanguard 500 Index"
  InvestmentType type = 5 [json_name = "type"];
  int64 quantity = 6 [json_name = "quantity"];  // in smallest units (satoshis for crypto, shares for stocks * 10000)
  int64 averageCost = 7 [json_name = "averageCost"];  // Average cost per unit in currency's smallest unit
  int64 totalCost = 8 [json_name = "totalCost"];  // Total cost basis (quantity * average_cost)
  string currency = 9 [json_name = "currency"];  // ISO 4217 code
  int64 currentPrice = 10 [json_name = "currentPrice"];  // Latest market price (0 if not available)
  int64 currentValue = 11 [json_name = "currentValue"];  // quantity * current_price
  int64 unrealizedPnl = 12 [json_name = "unrealizedPnl"];  // current_value - total_cost
  double unrealizedPnlPercent = 13 [json_name = "unrealizedPnlPercent"];  // ((current_value - total_cost) / total_cost) * 100
  int64 realizedPnl = 14 [json_name = "realizedPnl"];  // From sold positions
  int64 createdAt = 15 [json_name = "createdAt"];
  int64 updatedAt = 16 [json_name = "updatedAt"];
  // Conversion fields (populated when user's preferred currency differs from investment currency)
  wealthjourney.common.v1.Money displayTotalCost = 17 [json_name = "displayTotalCost"];  // Total cost in user's preferred currency
  wealthjourney.common.v1.Money displayCurrentValue = 18 [json_name = "displayCurrentValue"];  // Current value in user's preferred currency
  wealthjourney.common.v1.Money displayUnrealizedPnl = 19 [json_name = "displayUnrealizedPnl"];  // Unrealized PNL in user's preferred currency
  wealthjourney.common.v1.Money displayRealizedPnl = 20 [json_name = "displayRealizedPnl"];  // Realized PNL in user's preferred currency
  string displayCurrency = 21 [json_name = "displayCurrency"];  // User's preferred currency code
  int64 totalDividends = 22 [json_name = "totalDividends"];  // Total dividends received
  string walletName = 23 [json_name = "walletName"];  // Name of the wallet (for display in "All Wallets" view)
  string purchaseUnit = 24 [json_name = "purchaseUnit"];  // User's purchase unit for display ("mace", "tael", "kg", "oz", "gram")
  wealthjourney.common.v1.Money displayCurrentPrice = 25 [json_name = "displayCurrentPrice"];  // Current price in user's preferred currency
  wealthjourney.common.v1.Money displayAverageCost = 26 [json_name = "displayAverageCost"];  // Average cost in user's preferred currency
  bool isCustom = 27 [json_name = "isCustom"];  // True if manual entry without market data validation
  int32 userId = 28 [json_name = "userId"];  // Owner user ID (read-only, set by server from JWT)
  int64 price_updated_at = 29 [json_name = "priceUpdatedAt"];  // Unix timestamp when price was last updated by background job (0 if never)
}

enum InvestmentType {
  INVESTMENT_TYPE_UNSPECIFIED = 0;
  INVESTMENT_TYPE_CRYPTOCURRENCY = 1;
  INVESTMENT_TYPE_STOCK = 2;
  INVESTMENT_TYPE_ETF = 3;
  INVESTMENT_TYPE_MUTUAL_FUND = 4;
  INVESTMENT_TYPE_BOND = 5;
  INVESTMENT_TYPE_COMMODITY = 6;
  INVESTMENT_TYPE_OTHER = 7;
  // Gold-specific types for dual conversion (unit + currency)
  INVESTMENT_TYPE_GOLD_VND = 8;      // Vietnamese gold (SJC) - priced in VND, stored in grams
  INVESTMENT_TYPE_GOLD_USD = 9;      // World gold (XAU/USD) - priced in USD, stored in ounces
  // Silver-specific types for dual conversion (unit + currency)
  INVESTMENT_TYPE_SILVER_VND = 10;   // Vietnamese silver - priced in VND, stored in grams
  INVESTMENT_TYPE_SILVER_USD = 11;   // World silver (XAG/USD) - priced in USD, stored in ounces
  // Additional asset types
  INVESTMENT_TYPE_CASH = 12;              // Cash/savings tracking
  INVESTMENT_TYPE_FOREIGN_CURRENCY = 13;  // Foreign currency holdings
}

// InvestmentTransaction represents a buy or sell transaction
message InvestmentTransaction {
  int32 id = 1 [json_name = "id"];
  int32 investmentId = 2 [json_name = "investmentId"];
  int32 walletId = 3 [json_name = "walletId"];
  InvestmentTransactionType type = 4 [json_name = "type"];
  int64 quantity = 5 [json_name = "quantity"];  // Quantity transacted
  int64 price = 6 [json_name = "price"];  // Price per unit
  int64 cost = 7 [json_name = "cost"];  // Total cost (quantity * price + fees)
  int64 fees = 8 [json_name = "fees"];  // Transaction fees
  int64 transactionDate = 9 [json_name = "transactionDate"];  // Unix timestamp
  string notes = 10 [json_name = "notes"];
  int64 createdAt = 11 [json_name = "createdAt"];
  int64 updatedAt = 12 [json_name = "updatedAt"];
  // Lot tracking for FIFO
  int32 lotId = 13 [json_name = "lotId"];  // ID of the lot this transaction affects
  int32 remainingQuantity = 14 [json_name = "remainingQuantity"];  // For buy lots: how much is left to sell
  // Display fields (populated when user's preferred currency differs from investment currency)
  wealthjourney.common.v1.Money displayPrice = 15 [json_name = "displayPrice"];  // Price in user's preferred currency
  wealthjourney.common.v1.Money displayCost = 16 [json_name = "displayCost"];  // Total cost in user's preferred currency
  wealthjourney.common.v1.Money displayFees = 17 [json_name = "displayFees"];  // Fees in user's preferred currency
  string displayCurrency = 18 [json_name = "displayCurrency"];  // User's preferred currency code
}

enum InvestmentTransactionType {
  INVESTMENT_TRANSACTION_TYPE_UNSPECIFIED = 0;
  INVESTMENT_TRANSACTION_TYPE_BUY = 1;
  INVESTMENT_TRANSACTION_TYPE_SELL = 2;
  INVESTMENT_TRANSACTION_TYPE_DIVIDEND = 3;
  INVESTMENT_TRANSACTION_TYPE_SPLIT = 4;
}

// PnlPeriod defines the time window for period-scoped PnL calculation
enum PnlPeriod {
  PNL_PERIOD_UNSPECIFIED = 0;  // Same as ALL — returns existing all-time PnL
  PNL_PERIOD_1D = 1;
  PNL_PERIOD_1W = 2;
  PNL_PERIOD_1M = 3;
  PNL_PERIOD_ALL = 4;
}

// Portfolio summary for dashboard
message PortfolioSummary {
  int64 totalValue = 1 [json_name = "totalValue"];
  int64 totalCost = 2 [json_name = "totalCost"];
  int64 totalPnl = 3 [json_name = "totalPnl"];
  double totalPnlPercent = 4 [json_name = "totalPnlPercent"];
  int64 realizedPnl = 5 [json_name = "realizedPnl"];
  int64 unrealizedPnl = 6 [json_name = "unrealizedPnl"];
  int32 totalInvestments = 7 [json_name = "totalInvestments"];
  repeated InvestmentByType investmentsByType = 8 [json_name = "investmentsByType"];
  // Conversion fields (populated when user's preferred currency differs from summary currency)
  string currency = 9 [json_name = "currency"];  // Base currency of the summary
  wealthjourney.common.v1.Money displayTotalValue = 10 [json_name = "displayTotalValue"];  // Total value in user's preferred currency
  wealthjourney.common.v1.Money displayTotalCost = 11 [json_name = "displayTotalCost"];  // Total cost in user's preferred currency
  wealthjourney.common.v1.Money displayTotalPnl = 12 [json_name = "displayTotalPnl"];  // Total PNL in user's preferred currency
  wealthjourney.common.v1.Money displayRealizedPnl = 13 [json_name = "displayRealizedPnl"];  // Realized PNL in user's preferred currency
  wealthjourney.common.v1.Money displayUnrealizedPnl = 14 [json_name = "displayUnrealizedPnl"];  // Unrealized PNL in user's preferred currency
  string displayCurrency = 15 [json_name = "displayCurrency"];  // User's preferred currency code
  repeated InvestmentPerformance topPerformers = 16 [json_name = "topPerformers"]; // Top 3 performing investments
  repeated InvestmentPerformance worstPerformers = 17 [json_name = "worstPerformers"]; // Bottom 3 performing investments
  int64  periodPnl        = 18 [json_name = "periodPnl"];        // PnL for the selected period window
  double periodPnlPercent = 19 [json_name = "periodPnlPercent"]; // PnL% for the selected period window
  PnlPeriod period        = 20 [json_name = "period"];           // The period used for this response
  bool periodPnlApproximate = 21 [json_name = "periodPnlApproximate"]; // true when period PnL falls back to all-time (no snapshot available)
}

message InvestmentByType {
  InvestmentType type = 1 [json_name = "type"];
  int64 totalValue = 2 [json_name = "totalValue"];
  int32 count = 3 [json_name = "count"];
}

// InvestmentPerformance represents top/worst performing investments
message InvestmentPerformance {
  int32 investmentId = 1 [json_name = "investmentId"];
  string symbol = 2 [json_name = "symbol"];
  string name = 3 [json_name = "name"];
  InvestmentType type = 4 [json_name = "type"];
  int64 unrealizedPnl = 5 [json_name = "unrealizedPnl"];
  double unrealizedPnlPercent = 6 [json_name = "unrealizedPnlPercent"];
  wealthjourney.common.v1.Money displayUnrealizedPnl = 7 [json_name = "displayUnrealizedPnl"];
  string displayCurrency = 8 [json_name = "displayCurrency"];
}

// HistoricalPortfolioValue represents a single portfolio value snapshot
message HistoricalPortfolioValue {
  int64 timestamp = 1 [json_name = "timestamp"];      // Unix timestamp when snapshot was taken
  int64 totalValue = 2 [json_name = "totalValue"];    // Total portfolio value in base currency
  wealthjourney.common.v1.Money displayTotalValue = 3 [json_name = "displayTotalValue"]; // Value in user's preferred currency
}

// GetHistoricalPortfolioValuesRequest for fetching historical data
message GetHistoricalPortfolioValuesRequest {
  int32 walletId = 1 [json_name = "walletId"];       // 0 or omitted = all investment wallets
  InvestmentType typeFilter = 2 [json_name = "typeFilter"]; // Optional filter by investment type
  int32 days = 3 [json_name = "days"];               // Number of days of history (default: 30, max: 365)
  int32 points = 4 [json_name = "points"];           // Number of data points to return (default: 10, max: 100)
}

// GetHistoricalPortfolioValuesResponse with historical portfolio values
message GetHistoricalPortfolioValuesResponse {
  bool success = 1 [json_name = "success"];
  string message = 2 [json_name = "message"];
  repeated HistoricalPortfolioValue data = 3 [json_name = "data"];
  string timestamp = 4 [json_name = "timestamp"];
}

// GoldTypeCode represents a gold type available for investment
// Used for frontend selection of gold investments
message GoldTypeCode {
  string code = 1 [json_name = "code"];           // e.g., "SJL1L10", "XAU"
  string name = 2 [json_name = "name"];           // Display name (e.g., "SJC 1L-10L", "Gold World")
  string currency = 3 [json_name = "currency"];   // "VND" or "USD"
  string unit = 4 [json_name = "unit"];           // "mace", "gram", or "oz"
  double unitWeight = 5 [json_name = "unitWeight"]; // Weight in grams
  int32 type = 6 [json_name = "type"];            // InvestmentType enum value
}

// GetGoldTypeCodesRequest for fetching available gold types
message GetGoldTypeCodesRequest {
  string currency = 1 [json_name = "currency"];  // Optional filter: "VND", "USD", or empty for all
}

// GetGoldTypeCodesResponse for gold type codes
message GetGoldTypeCodesResponse {
  bool success = 1 [json_name = "success"];
  repeated GoldTypeCode data = 2 [json_name = "data"];
  string timestamp = 3 [json_name = "timestamp"];
}

// SilverTypeCode represents a silver type available for investment
// Used for frontend selection of silver investments
message SilverTypeCode {
  string code = 1 [json_name = "code"];           // e.g., "AG_VND", "XAG"
  string name = 2 [json_name = "name"];           // Display name (e.g., "Bạc Việt Nam 999", "Silver World")
  string currency = 3 [json_name = "currency"];   // "VND" or "USD"
  int32 type = 4 [json_name = "type"];            // InvestmentType enum value
}

// GetSilverTypeCodesRequest for fetching available silver types
message GetSilverTypeCodesRequest {
  string currency = 1 [json_name = "currency"];  // Optional filter: "VND", "USD", or empty for all
}

// GetSilverTypeCodesResponse for silver type codes
message GetSilverTypeCodesResponse {
  bool success = 1 [json_name = "success"];
  repeated SilverTypeCode data = 2 [json_name = "data"];
  string timestamp = 3 [json_name = "timestamp"];
}

// GetMarketPriceRequest - Fetch current market price for display
message GetMarketPriceRequest {
  string symbol = 1 [json_name = "symbol"];           // e.g., "AAPL", "BTC-USD", "SJL1L10"
  string currency = 2 [json_name = "currency"];       // ISO 4217 code
  InvestmentType type = 3 [json_name = "type"];       // For routing to correct API
}

// GetMarketPriceResponse - Market price with metadata
message GetMarketPriceResponse {
  bool success = 1 [json_name = "success"];
  string message = 2 [json_name = "message"];
  MarketPrice data = 3 [json_name = "data"];
  string timestamp = 4 [json_name = "timestamp"];
}

// PriceItem represents a single gold or silver price entry
message PriceItem {
  string typeCode = 1 [json_name = "typeCode"];
  int64 buy = 2 [json_name = "buy"];
  int64 sell = 3 [json_name = "sell"];
  int64 changeBuy = 4 [json_name = "changeBuy"];
  int64 changeSell = 5 [json_name = "changeSell"];
  string currency = 6 [json_name = "currency"];
  int64 updatedAt = 7 [json_name = "updatedAt"];
  string name = 8 [json_name = "name"];
  bool isOverridden = 9 [json_name = "isOverridden"];  // True if price was admin-overridden
  bool isStale = 10 [json_name = "isStale"];  // True when price fetch failed
}

// GetMarketPricesRequest for fetching all gold and silver prices
message GetMarketPricesRequest {}

// GetMarketPricesResponse returns all gold, silver, and currency prices
message GetMarketPricesResponse {
  bool success = 1 [json_name = "success"];
  string message = 2 [json_name = "message"];
  repeated PriceItem gold = 3 [json_name = "gold"];
  repeated PriceItem silver = 4 [json_name = "silver"];
  string timestamp = 5 [json_name = "timestamp"];
  repeated PriceItem currency = 6 [json_name = "currency"];
}

// MarketPrice - Price data with freshness info
message MarketPrice {
  string symbol = 1 [json_name = "symbol"];
  string currency = 2 [json_name = "currency"];
  int64 price = 3 [json_name = "price"];              // Smallest currency unit
  double priceDecimal = 4 [json_name = "priceDecimal"]; // Convenience field
  int64 timestamp = 5 [json_name = "timestamp"];      // Unix seconds
  bool isCached = 6 [json_name = "isCached"];         // Cache hit indicator
  string displayUnit = 7 [json_name = "displayUnit"]; // "mace", "oz", "unit", etc.
}

// ChartDataPoint represents a single price data point for chart display
message ChartDataPoint {
  int64 timestamp = 1 [json_name = "timestamp"];
  double buy = 2 [json_name = "buy"];
  double sell = 3 [json_name = "sell"];
}

// GetGoldChartRequest for fetching gold price history
message GetGoldChartRequest {
  string market = 1 [json_name = "market"];
  string goldCode = 2 [json_name = "goldCode"];
  string period = 3 [json_name = "period"];
}

// GetGoldChartResponse with gold price history data points
message GetGoldChartResponse {
  bool success = 1 [json_name = "success"];
  string message = 2 [json_name = "message"];
  repeated ChartDataPoint data = 3 [json_name = "data"];
  string market = 4 [json_name = "market"];
  string goldCode = 5 [json_name = "goldCode"];
  string period = 6 [json_name = "period"];
  string currency = 7 [json_name = "currency"];
  string timestamp = 8 [json_name = "timestamp"];
}

// GetSilverChartRequest for fetching silver price history
message GetSilverChartRequest {
  string market = 1 [json_name = "market"];
  string type = 2 [json_name = "type"];
  int32 days = 3 [json_name = "days"];
}

// GetSilverChartResponse with silver price history data points
message GetSilverChartResponse {
  bool success = 1 [json_name = "success"];
  string message = 2 [json_name = "message"];
  repeated ChartDataPoint data = 3 [json_name = "data"];
  string market = 4 [json_name = "market"];
  string type = 5 [json_name = "type"];
  int32 days = 6 [json_name = "days"];
  string currency = 7 [json_name = "currency"];
  string timestamp = 8 [json_name = "timestamp"];
}

// Service definition
service InvestmentService {
  // List all investments in a wallet
  rpc ListInvestments(ListInvestmentsRequest) returns (ListInvestmentsResponse) {
    option (google.api.http) = {
      get: "/api/v1/wallets/{walletId}/investments"
    };
  }

  // Get a specific investment
  rpc GetInvestment(GetInvestmentRequest) returns (GetInvestmentResponse) {
    option (google.api.http) = {
      get: "/api/v1/investments/{id}"
    };
  }

  // Create a new investment holding
  rpc CreateInvestment(CreateInvestmentRequest) returns (CreateInvestmentResponse) {
    option (google.api.http) = {
      post: "/api/v1/investments"
      body: "*"
    };
  }

  // Update investment details
  rpc UpdateInvestment(UpdateInvestmentRequest) returns (UpdateInvestmentResponse) {
    option (google.api.http) = {
      put: "/api/v1/investments/{id}"
      body: "*"
    };
  }

  // Delete an investment
  rpc DeleteInvestment(DeleteInvestmentRequest) returns (DeleteInvestmentResponse) {
    option (google.api.http) = {
      delete: "/api/v1/investments/{id}"
    };
  }

  // Add a buy/sell transaction
  rpc AddInvestmentTransaction(AddTransactionRequest) returns (AddTransactionResponse) {
    option (google.api.http) = {
      post: "/api/v1/investments/{investmentId}/transactions"
      body: "*"
    };
  }

  // List transactions for an investment
  rpc ListInvestmentTransactions(ListInvestmentTransactionsRequest) returns (ListInvestmentTransactionsResponse) {
    option (google.api.http) = {
      get: "/api/v1/investments/{investmentId}/transactions"
    };
  }

  // Edit a transaction
  rpc EditInvestmentTransaction(EditInvestmentTransactionRequest) returns (EditInvestmentTransactionResponse) {
    option (google.api.http) = {
      put: "/api/v1/investment-transactions/{id}"
      body: "*"
    };
  }

  // Delete a transaction
  rpc DeleteInvestmentTransaction(DeleteInvestmentTransactionRequest) returns (DeleteInvestmentTransactionResponse) {
    option (google.api.http) = {
      delete: "/api/v1/investment-transactions/{id}"
    };
  }

  // Get portfolio summary
  rpc GetPortfolioSummary(GetPortfolioSummaryRequest) returns (GetPortfolioSummaryResponse) {
    option (google.api.http) = {
      get: "/api/v1/wallets/{walletId}/portfolio-summary"
    };
  }

  // Update current prices (manual or automatic)
  rpc UpdatePrices(UpdatePricesRequest) returns (UpdatePricesResponse) {
    option (google.api.http) = {
      post: "/api/v1/investments/update-prices"
      body: "*"
    };
  }

  // SearchSymbols searches for investment symbols by query
  rpc SearchSymbols(SearchSymbolsRequest) returns (SearchSymbolsResponse) {
    option (google.api.http) = {
      get: "/api/v1/investments/symbols/search"
    };
  }

  // List all user investments across all wallets (or filtered by wallet)
  rpc ListUserInvestments(ListUserInvestmentsRequest) returns (ListUserInvestmentsResponse) {
    option (google.api.http) = {
      get: "/api/v1/investments"
    };
  }

  // Get aggregated portfolio summary across all wallets (or for specific wallet)
  rpc GetAggregatedPortfolioSummary(GetAggregatedPortfolioSummaryRequest) returns (GetPortfolioSummaryResponse) {
    option (google.api.http) = {
      get: "/api/v1/portfolio-summary"
    };
  }

  // GetGoldTypeCodes returns available gold type codes for investment creation
  // Used for frontend dropdown selection of gold investments
  rpc GetGoldTypeCodes(GetGoldTypeCodesRequest) returns (GetGoldTypeCodesResponse) {
    option (google.api.http) = {
      get: "/api/v1/investments/gold-types"
    };
  }

  // GetSilverTypeCodes returns available silver type codes for investment creation
  // Used for frontend dropdown selection of silver investments
  rpc GetSilverTypeCodes(GetSilverTypeCodesRequest) returns (GetSilverTypeCodesResponse) {
    option (google.api.http) = {
      get: "/api/v1/investments/silver-types"
    };
  }

  // GetHistoricalPortfolioValues returns historical portfolio value snapshots
  rpc GetHistoricalPortfolioValues(GetHistoricalPortfolioValuesRequest) returns (GetHistoricalPortfolioValuesResponse) {
    option (google.api.http) = {
      get: "/api/v1/portfolio/historical-values"
    };
  }

  // GetMarketPrice retrieves current market price for display in forms
  rpc GetMarketPrice(GetMarketPriceRequest) returns (GetMarketPriceResponse) {
    option (google.api.http) = {
      get: "/api/v1/investments/market-price"
    };
  }

  // GetMarketPrices returns all gold and silver prices in one call
  rpc GetMarketPrices(GetMarketPricesRequest) returns (GetMarketPricesResponse) {
    option (google.api.http) = {
      get: "/api/v1/investments/market-prices"
    };
  }

  // GetGoldChart returns historical gold price data for chart display
  rpc GetGoldChart(GetGoldChartRequest) returns (GetGoldChartResponse) {
    option (google.api.http) = {
      get: "/api/v1/investments/gold-chart"
    };
  }

  // GetSilverChart returns historical silver price data for chart display
  rpc GetSilverChart(GetSilverChartRequest) returns (GetSilverChartResponse) {
    option (google.api.http) = {
      get: "/api/v1/investments/silver-chart"
    };
  }

  // GetPublicMarketTypes returns gold/silver type names without prices (no auth required)
  rpc GetPublicMarketTypes(GetPublicMarketTypesRequest) returns (GetPublicMarketTypesResponse) {
    option (google.api.http) = {
      get: "/api/v1/public/market-types"
    };
  }

  rpc CreateUserPriceAlert(CreateUserPriceAlertRequest) returns (CreateUserPriceAlertResponse) {
    option (google.api.http) = { post: "/api/v1/price-alerts" body: "*" };
  }
  rpc ListUserPriceAlerts(ListUserPriceAlertsRequest) returns (ListUserPriceAlertsResponse) {
    option (google.api.http) = { get: "/api/v1/price-alerts" };
  }
  rpc UpdateUserPriceAlert(UpdateUserPriceAlertRequest) returns (UpdateUserPriceAlertResponse) {
    option (google.api.http) = { put: "/api/v1/price-alerts/{id}" body: "*" };
  }
  rpc DeleteUserPriceAlert(DeleteUserPriceAlertRequest) returns (DeleteUserPriceAlertResponse) {
    option (google.api.http) = { delete: "/api/v1/price-alerts/{id}" };
  }
}

// Request/Response messages
message ListInvestmentsRequest {
  int32 walletId = 1 [json_name = "walletId"];
  wealthjourney.common.v1.PaginationParams pagination = 2 [json_name = "pagination"];
  InvestmentType typeFilter = 3 [json_name = "typeFilter"];  // Optional filter by type
}

message ListInvestmentsResponse {
  bool success = 1 [json_name = "success"];
  string message = 2 [json_name = "message"];
  repeated Investment data = 3 [json_name = "data"];
  string timestamp = 4 [json_name = "timestamp"];
  wealthjourney.common.v1.PaginationResult pagination = 5 [json_name = "pagination"];
}

message GetInvestmentRequest {
  int32 id = 1 [json_name = "id"];
}

message GetInvestmentResponse {
  bool success = 1 [json_name = "success"];
  string message = 2 [json_name = "message"];
  Investment data = 3 [json_name = "data"];
  string timestamp = 4 [json_name = "timestamp"];
}

// CreateInvestmentRequest creates a new investment holding.
//
// For market-based investments (isCustom=false, default):
// - Symbol must exist in market data APIs (Yahoo Finance, vang.today)
// - Currency is validated against market data
// - Current price fetched from market APIs
//
// For custom investments (isCustom=true):
// - Symbol can be any user-defined string
// - Currency must be provided manually
// - Current price defaults to 0 (can be set manually later via UpdateInvestment)
message CreateInvestmentRequest {
  int32 walletId = 1 [json_name = "walletId"];
  string symbol = 2 [json_name = "symbol"];
  string name = 3 [json_name = "name"];
  InvestmentType type = 4 [json_name = "type"];
  int64 initialQuantity = 5 [json_name = "initialQuantity"];
  int64 initialCost = 6 [json_name = "initialCost"];  // Total cost in smallest currency unit (cents for USD, dong for VND)
  string currency = 7 [json_name = "currency"];

  // Optional: Provide decimal values for convenience (server converts to int64)
  // If provided, these take precedence over initialQuantity/initialCost
  double initialQuantityDecimal = 8 [json_name = "initialQuantityDecimal"];
  double initialCostDecimal = 9 [json_name = "initialCostDecimal"];  // Total cost as decimal (e.g., 1500.50 for $1,500.50)
  bool isCustom = 10 [json_name = "isCustom"];  // If true, skip market data validation and allow currentPrice=0
  int64 purchaseDate = 11 [json_name = "purchaseDate"];  // Optional: Unix timestamp (0 = not set, use current time)
  string purchaseUnit = 13 [json_name = "purchaseUnit"];  // User's input unit ("mace", "tael", "kg", "oz", "gram")
}

message CreateInvestmentResponse {
  bool success = 1 [json_name = "success"];
  string message = 2 [json_name = "message"];
  Investment data = 3 [json_name = "data"];
  string timestamp = 4 [json_name = "timestamp"];
}

message UpdateInvestmentRequest {
  int32 id = 1 [json_name = "id"];
  string name = 2 [json_name = "name"];
  int64 currentPrice = 3 [json_name = "currentPrice"];  // Manual price override
}

message UpdateInvestmentResponse {
  bool success = 1 [json_name = "success"];
  string message = 2 [json_name = "message"];
  Investment data = 3 [json_name = "data"];
  string timestamp = 4 [json_name = "timestamp"];
}

message DeleteInvestmentRequest {
  int32 id = 1 [json_name = "id"];
}

message DeleteInvestmentResponse {
  bool success = 1 [json_name = "success"];
  string message = 2 [json_name = "message"];
