syntax = "proto3";

package wealthjourney.admin.v1;

import "google/api/annotations.proto";
import "protobuf/v1/common.proto";
import "protobuf/v1/feedback.proto";

option go_package = "protobuf/v1";

// AdminService provides admin-only operations for managing price overrides.
service AdminService {
  // SetPriceOverride creates or updates a price override
  rpc SetPriceOverride(SetPriceOverrideRequest) returns (SetPriceOverrideResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/price-overrides"
      body: "*"
    };
  }

  // ListPriceOverrides returns all price overrides, optionally filtered by category
  rpc ListPriceOverrides(ListPriceOverridesRequest) returns (ListPriceOverridesResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/price-overrides"
    };
  }

  // DeletePriceOverride removes a price override
  rpc DeletePriceOverride(DeletePriceOverrideRequest) returns (DeletePriceOverrideResponse) {
    option (google.api.http) = {
      delete: "/api/v1/admin/price-overrides"
    };
  }

  // AdminListUsers lists all users with optional search and pagination
  rpc AdminListUsers(AdminListUsersRequest) returns (AdminListUsersResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/users"
    };
  }

  // AdminToggleRole toggles a user's admin role
  rpc AdminToggleRole(AdminToggleRoleRequest) returns (AdminToggleRoleResponse) {
    option (google.api.http) = {
      put: "/api/v1/admin/users/{userId}/role"
      body: "*"
    };
  }

  // AdminListFeedback lists all feedback with optional status filter
  rpc AdminListFeedback(AdminListFeedbackRequest) returns (AdminListFeedbackResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/feedback"
    };
  }

  // AdminUpdateFeedback updates feedback status and admin note
  rpc AdminUpdateFeedback(AdminUpdateFeedbackRequest) returns (AdminUpdateFeedbackResponse) {
    option (google.api.http) = {
      put: "/api/v1/admin/feedback/{feedbackId}"
      body: "*"
    };
  }

  // AdminDeleteFeedback soft-deletes a feedback entry
  rpc AdminDeleteFeedback(AdminDeleteFeedbackRequest) returns (AdminDeleteFeedbackResponse) {
    option (google.api.http) = {
      delete: "/api/v1/admin/feedback/{feedbackId}"
    };
  }
}

// PriceCategory represents the type of market price
enum PriceCategory {
  PRICE_CATEGORY_UNSPECIFIED = 0;
  PRICE_CATEGORY_GOLD = 1;
  PRICE_CATEGORY_SILVER = 2;
  PRICE_CATEGORY_CURRENCY = 3;
  PRICE_CATEGORY_STOCK = 4;
}

// PriceOverride represents an admin-set price override stored in Redis
message PriceOverride {
  string typeCode = 1 [json_name = "typeCode"];
  string name = 2 [json_name = "name"];
  int64 buy = 3 [json_name = "buy"];
  int64 sell = 4 [json_name = "sell"];
  string currency = 5 [json_name = "currency"];
  PriceCategory category = 6 [json_name = "category"];
  int32 updatedBy = 7 [json_name = "updatedBy"];
  int64 updatedAt = 8 [json_name = "updatedAt"];
}

// SetPriceOverrideRequest creates or updates a price override
message SetPriceOverrideRequest {
  PriceCategory category = 1 [json_name = "category"];
  string typeCode = 2 [json_name = "typeCode"];
  string currency = 3 [json_name = "currency"];
  int64 buy = 4 [json_name = "buy"];
  int64 sell = 5 [json_name = "sell"];
  string name = 6 [json_name = "name"];
}

// SetPriceOverrideResponse returns the saved override
message SetPriceOverrideResponse {
  bool success = 1 [json_name = "success"];
  string message = 2 [json_name = "message"];
  PriceOverride override = 3 [json_name = "override"];
}

// ListPriceOverridesRequest optionally filters by category
message ListPriceOverridesRequest {
  PriceCategory category = 1 [json_name = "category"];
}

// ListPriceOverridesResponse returns all matching overrides
message ListPriceOverridesResponse {
  bool success = 1 [json_name = "success"];
  repeated PriceOverride overrides = 2 [json_name = "overrides"];
}

// DeletePriceOverrideRequest identifies the override to remove
message DeletePriceOverrideRequest {
  PriceCategory category = 1 [json_name = "category"];
  string typeCode = 2 [json_name = "typeCode"];
  string currency = 3 [json_name = "currency"];
}

// DeletePriceOverrideResponse confirms deletion
message DeletePriceOverrideResponse {
  bool success = 1 [json_name = "success"];
  string message = 2 [json_name = "message"];
}

// --- Admin User Management ---

message AdminUserItem {
  int32 id = 1 [json_name = "id"];
  string name = 2 [json_name = "name"];
  string email = 3 [json_name = "email"];
  string username = 4 [json_name = "username"];
  string picture = 5 [json_name = "picture"];
  string authProvider = 6 [json_name = "authProvider"];
  bool isAdmin = 7 [json_name = "isAdmin"];
  int64 createdAt = 8 [json_name = "createdAt"];
}

message AdminListUsersRequest {
  wealthjourney.common.v1.PaginationParams pagination = 1 [json_name = "pagination"];
  string search = 2 [json_name = "search"];
}

message AdminListUsersResponse {
  bool success = 1 [json_name = "success"];
  string message = 2 [json_name = "message"];
  repeated AdminUserItem users = 3 [json_name = "users"];
  wealthjourney.common.v1.PaginationResult pagination = 4 [json_name = "pagination"];
  string timestamp = 5 [json_name = "timestamp"];
}

message AdminToggleRoleRequest {
  int32 userId = 1 [json_name = "userId"];
  bool isAdmin = 2 [json_name = "isAdmin"];
}

message AdminToggleRoleResponse {
  bool success = 1 [json_name = "success"];
  string message = 2 [json_name = "message"];
  AdminUserItem user = 3 [json_name = "user"];
  string timestamp = 4 [json_name = "timestamp"];
}

// --- Admin Feedback Management ---

message AdminFeedbackItem {
  int32 id = 1 [json_name = "id"];
  int32 userId = 2 [json_name = "userId"];
  string userName = 3 [json_name = "userName"];
  string userEmail = 4 [json_name = "userEmail"];
  string subject = 5 [json_name = "subject"];
  string message = 6 [json_name = "message"];
  wealthjourney.feedback.v1.FeedbackStatus status = 7 [json_name = "status"];
  string adminNote = 8 [json_name = "adminNote"];
  int64 createdAt = 9 [json_name = "createdAt"];
  int64 updatedAt = 10 [json_name = "updatedAt"];
}

message AdminListFeedbackRequest {
  wealthjourney.common.v1.PaginationParams pagination = 1 [json_name = "pagination"];
  int32 status = 2 [json_name = "status"];
}

message AdminListFeedbackResponse {
  bool success = 1 [json_name = "success"];
  string message = 2 [json_name = "message"];
  repeated AdminFeedbackItem feedback = 3 [json_name = "feedback"];
  wealthjourney.common.v1.PaginationResult pagination = 4 [json_name = "pagination"];
  string timestamp = 5 [json_name = "timestamp"];
}

message AdminUpdateFeedbackRequest {
  int32 feedbackId = 1 [json_name = "feedbackId"];
  int32 status = 2 [json_name = "status"];
  string adminNote = 3 [json_name = "adminNote"];
}

message AdminUpdateFeedbackResponse {
  bool success = 1 [json_name = "success"];
  string message = 2 [json_name = "message"];
  AdminFeedbackItem feedback = 3 [json_name = "feedback"];
  string timestamp = 4 [json_name = "timestamp"];
}

message AdminDeleteFeedbackRequest {
  int32 feedbackId = 1 [json_name = "feedbackId"];
}

message AdminDeleteFeedbackResponse {
  bool success = 1 [json_name = "success"];
  string message = 2 [json_name = "message"];
  string timestamp = 3 [json_name = "timestamp"];
}

// CMS — Site Settings Management

message SiteSetting {
  string key = 1 [json_name = "key"];
  string value = 2 [json_name = "value"];
  int32 updatedBy = 3 [json_name = "updatedBy"];
  int64 updatedAt = 4 [json_name = "updatedAt"];
}

message GetSiteSettingsRequest {}

message GetSiteSettingsResponse {
  bool success = 1 [json_name = "success"];
  repeated SiteSetting settings = 2 [json_name = "settings"];
}

message UpdateSiteSettingsRequest {
  repeated SiteSetting settings = 1 [json_name = "settings"];
}

message UpdateSiteSettingsResponse {
  bool success = 1 [json_name = "success"];
  string message = 2 [json_name = "message"];
  repeated SiteSetting settings = 3 [json_name = "settings"];
}
