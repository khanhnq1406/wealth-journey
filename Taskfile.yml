# https://taskfile.dev
version: '3'

vars:
  BACKEND_DIR: "./src/go-backend"
  FRONTEND_DIR: "./src/wj-client"
  FRONTEND_GEN_DIR: "./src/wj-client/gen"
  API_DIR: "./api"

tasks:
  default:
    desc: "Show available tasks"
    cmds:
      - task --list

  # Backend tasks
  backend:dev:
    desc: "Start backend in development mode"
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - make dev
    interactive: true

  backend:start:
    desc: "Start backend standalone server"
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - make run
    interactive: true

  backend:build:
    desc: "Build backend standalone server"
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - make build

  backend:test:
    desc: "Run backend tests"
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - make test

  backend:deps:
    desc: "Install backend dependencies"
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - make deps

  backend:migrate-categories:
    desc: "Run migration to create default categories for existing users"
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - go run ./cmd/migrate-default-categories

  backend:migrate-category-idx:
    desc: "Create category type index for performance"
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - go run ./cmd/migrate-category-idx

  backend:migrate-site-settings:
    desc: "Create site_settings table and seed initial data"
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - go run cmd/migrate-site-settings/main.go

  backend:migrate-sessions:
    desc: "Create session indexes for multi-device login support"
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - go run cmd/migrate-sessions/main.go

  backend:migrate-add-is-custom:
    desc: "Add is_custom column to investment table"
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - go run cmd/migrate-add-is-custom/main.go

  backend:migrate-wallet-type:
    desc: "Convert INVESTMENT wallets to BASIC"
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - go run cmd/migrate-wallet-type/main.go {{.CLI_ARGS}}

  backend:migrate-gold-silver-types:
    desc: "Migrate existing gold/silver investments to new vang247 type codes"
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - go run cmd/migrate-gold-silver-types/main.go

  backend:migrate-i18n-language:
    desc: "Add preferred_language column to user table for i18n support"
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - go run cmd/migrate-i18n-language/main.go

  backend:migrate-community:
    desc: "Create community tables (post, comment, post_like, user_follow, content_report) and add bio to user"
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - go run cmd/migrate-community/main.go

  backend:migrate-drop-topic:
    desc: "Drop topic_tag column from post table (topic feature removed)"
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - go run cmd/migrate-drop-topic/main.go

  backend:migrate-community-phase3:
    desc: Run community phase 3 database migration
    dir: src/go-backend
    cmds:
      - go run cmd/migrate-community-phase3/main.go

  backend:migrate-profile-url-size:
    desc: Expand picture and cover_photo_url columns to VARCHAR(2048)
    dir: src/go-backend
    cmds:
      - go run cmd/migrate-profile-url-size/main.go

  backend:migrate-gold-sentiment:
    desc: "Create gold_vote and gold_vote_comment tables"
    dir: src/go-backend
    cmds:
      - go run cmd/migrate-gold-sentiment/main.go

  backend:migrate-password-auth:
    desc: "Add username, password_hash, auth_provider columns to user table"
    dir: src/go-backend
    cmds:
      - go run cmd/migrate-password-auth/main.go

  backend:migrate-email-nullable:
    desc: "Make email nullable for password-only users"
    dir: src/go-backend
    cmds:
      - go run cmd/migrate-email-nullable/main.go

  backend:migrate-admin:
    desc: "Add is_admin column to user table"
    dir: src/go-backend
    cmds:
      - go run cmd/migrate-admin/main.go

  backend:migrate-investment-user-ownership:
    desc: "Add user_id to investment/investment_transaction, make wallet_id nullable"
    dir: src/go-backend
    cmds:
      - go run cmd/migrate-investment-user-ownership/main.go {{.CLI_ARGS}}

  backend:migrate-feedback:
    desc: "Create feedback table"
    dir: src/go-backend
    cmds:
      - go run cmd/migrate-feedback/main.go

  backend:migrate-feedback-admin-note:
    desc: "Add admin_note column to feedback table"
    dir: src/go-backend
    cmds:
      - go run cmd/migrate-feedback-admin-note/main.go

  backend:migrate-price-alerts:
    desc: "Add metadata column to notification, create push_subscription table"
    dir: src/go-backend
    cmds:
      - go run cmd/migrate-price-alerts/main.go

  backend:migrate-watchlist:
    desc: "Create watchlist table for symbol watchlist feature"
    dir: src/go-backend
    cmds:
      - go run cmd/migrate-watchlist/main.go

  backend:migrate-user-price-alerts:
    desc: "Create user_price_alert table for price alert feature"
    dir: src/go-backend
    cmds:
      - go run cmd/migrate-user-price-alerts/main.go

  backend:migrate-asset-prices:
    desc: "Create asset_price table for price caching"
    dir: src/go-backend
    cmds:
      - go run cmd/migrate-asset-prices/main.go

  backend:migrate-all:
    desc: "Run all migrations in order (safe for fresh or existing databases)"
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - echo "=== Running all migrations ==="
      # Schema migrations (column additions, table creation)
      - echo "[1/20] migrate-categories..."
      - go run ./cmd/migrate-default-categories
      - echo "[2/20] migrate-category-idx..."
      - go run ./cmd/migrate-category-idx
      - echo "[3/20] migrate-site-settings..."
      - go run cmd/migrate-site-settings/main.go
      - echo "[4/20] migrate-sessions..."
      - go run cmd/migrate-sessions/main.go
      - echo "[5/20] migrate-add-is-custom..."
      - go run cmd/migrate-add-is-custom/main.go
      - echo "[6/20] migrate-wallet-type..."
      - go run cmd/migrate-wallet-type/main.go --dry-run=false
      - echo "[7/20] migrate-gold-silver-types..."
      - go run cmd/migrate-gold-silver-types/main.go
      - echo "[8/20] migrate-i18n-language..."
      - go run cmd/migrate-i18n-language/main.go
      # Community
      - echo "[9/20] migrate-community..."
      - go run cmd/migrate-community/main.go
      - echo "[10/20] migrate-drop-topic..."
      - go run cmd/migrate-drop-topic/main.go
      - echo "[11/20] migrate-community-phase3..."
      - go run cmd/migrate-community-phase3/main.go
      - echo "[12/20] migrate-profile-url-size..."
      - go run cmd/migrate-profile-url-size/main.go
      # Gold & sentiment
      - echo "[13/20] migrate-gold-sentiment..."
      - go run cmd/migrate-gold-sentiment/main.go
      # Auth enhancements
      - echo "[14/20] migrate-password-auth..."
      - go run cmd/migrate-password-auth/main.go
      - echo "[15/20] migrate-email-nullable..."
      - go run cmd/migrate-email-nullable/main.go
      - echo "[16/20] migrate-admin..."
      - go run cmd/migrate-admin/main.go
      # Investment ownership
      - echo "[17/20] migrate-investment-user-ownership..."
      - go run cmd/migrate-investment-user-ownership/main.go --dry-run=false
      # Feedback
      - echo "[18/20] migrate-feedback..."
      - go run cmd/migrate-feedback/main.go
      - echo "[19/20] migrate-feedback-admin-note..."
      - go run cmd/migrate-feedback-admin-note/main.go
      # Notifications
      - echo "[20/20] migrate-price-alerts..."
      - go run cmd/migrate-price-alerts/main.go
      - echo "=== All migrations completed ==="

  backend:set-admin:
    desc: "Grant or revoke admin access for a user by email"
    dir: src/go-backend
    cmds:
      - go run cmd/set-admin/main.go -email={{.CLI_ARGS}}

  backend:revoke-admin:
    desc: "Revoke admin access for a user by email"
    dir: src/go-backend
    cmds:
      - go run cmd/set-admin/main.go -email={{.CLI_ARGS}} -revoke

  # Docker tasks (local Postgres + Redis)
  docker:up:
    desc: "Start local Postgres and Redis containers"
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - docker compose up -d
      - echo "Waiting for Postgres to be ready..."
      - docker compose exec postgres pg_isready -U wealthjourney --timeout=30
      - echo "Postgres and Redis are running!"

  docker:down:
    desc: "Stop local Postgres and Redis containers"
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - docker compose down

  docker:reset:
    desc: "Stop containers and remove all data volumes"
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - docker compose down -v
      - echo "Containers stopped and volumes removed."

  docker:logs:
    desc: "Show logs from Postgres and Redis containers"
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - docker compose logs -f
    interactive: true

  docker:status:
    desc: "Show status of local containers"
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - docker compose ps

  docker:psql:
    desc: "Open psql shell in the local Postgres container"
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - docker compose exec postgres psql -U wealthjourney -d wealthjourney
    interactive: true

  docker:redis:
    desc: "Open redis-cli shell in the local Redis container"
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - docker compose exec redis redis-cli
    interactive: true

  # Frontend tasks
  frontend:dev:
    desc: "Start frontend in development mode"
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm run dev
    interactive: true

  frontend:build:
    desc: "Build frontend for production"
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm run build

  frontend:start:
    desc: "Start frontend production server"
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm run start
    interactive: true

  frontend:lint:
    desc: "Run frontend linter"
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm run lint

  # Protobuf tasks
  proto:build:
    desc: "Generate Go code from protobuf files (outputs to ../src/go-backend)"
    dir: "{{.API_DIR}}"
    cmds:
      - buf generate --template buf.gen.go.yaml

  proto:clean:
    desc: "Remove generated protobuf code from both backend and frontend"
    cmds:
      - echo "Removing generated Go code from backend..."
      - rm -rf {{.BACKEND_DIR}}/gen/protobuf
      - echo "Removing generated TypeScript code from frontend..."
      - rm -rf {{.FRONTEND_GEN_DIR}}
      - echo "Clean complete!"

  proto:types:
    desc: "Generate TypeScript types from protobuf files (outputs to ../src/wj-client/gen)"
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm run generate:types

  proto:api:
    desc: "Generate REST API client from protobuf files"
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm run generate:api

  proto:all:
    desc: "Generate all protobuf code (Go backend + TypeScript frontend)"
    cmds:
      - echo "Generating protobuf code for backend..."
      - task: proto:build
      - echo "Generating protobuf code for frontend..."
      - task: proto:types
      - echo "Running frontend REST API generation..."
      - task: proto:api
      - echo "Protobuf generation complete!"

  # Combined tasks
  dev:
    desc: "Start Docker, backend, and frontend in development mode"
    cmds:
      - task: docker:up
      - echo "Starting backend and frontend in development mode..."
      - task: backend:dev &
      - task: frontend:dev
    interactive: true

  dev:backend:
    desc: "Start Docker and backend in development mode"
    cmds:
      - task: docker:up
      - task: backend:dev
    interactive: true

  dev:frontend:
    desc: "Start only frontend in development mode"
    cmds:
      - task: frontend:dev
    interactive: true

  build:all:
    desc: "Build both backend and frontend"
    cmds:
      - task: backend:build
      - task: frontend:build

  test:all:
    desc: "Run all tests"
    cmds:
      - task: backend:test
      - task: frontend:lint

  clean:
    desc: "Clean all build artifacts"
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - make clean

  setup:
    desc: "Install all dependencies (backend + frontend)"
    cmds:
      - task: backend:deps
      - task: frontend:install

  frontend:install:
    desc: "Install frontend dependencies"
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm install

  # CI tasks (local)
  ci:
    desc: "Run all CI checks locally (backend + frontend + security)"
    cmds:
      - ./scripts/ci-local.sh all

  ci:backend:
    desc: "Run backend CI checks locally (lint + build + test)"
    cmds:
      - ./scripts/ci-local.sh backend

  ci:backend-lint:
    desc: "Run backend lint + build only (no DB needed)"
    cmds:
      - ./scripts/ci-local.sh backend-lint

  ci:backend-test:
    desc: "Run backend tests only (needs Docker for DB + Redis)"
    cmds:
      - ./scripts/ci-local.sh backend-test

  ci:frontend:
    desc: "Run frontend CI checks locally (lint + typecheck + test + build)"
    cmds:
      - ./scripts/ci-local.sh frontend

  ci:frontend-e2e:
    desc: "Run Playwright E2E tests locally"
    cmds:
      - ./scripts/ci-local.sh frontend-e2e

  ci:security:
    desc: "Run security checks locally (govulncheck + npm audit)"
    cmds:
      - ./scripts/ci-local.sh security

  # Deployment tasks
  deploy:backend:
    desc: "Deploy backend to production (Railway)"
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - make deploy

  deploy:backend:preview:
    desc: "Deploy backend to preview environment (Railway)"
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - make deploy-preview
